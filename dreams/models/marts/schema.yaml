version: 2

models:
  - name: daily_sources
    description: "Метрики по дням и источникам"
    columns:
      - name: date
        tests:
          - not_null
    tests:
      - unique:
          column_name: "date || '-' || utm_source"

  - name: daily_metrics
    description: "Метрики по дням (общие)"
    columns:
      - name: date
        tests:
          - unique
          - not_null